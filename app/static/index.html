<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inngest Demo</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --border: #e3e6eb; --text: #1d2330; --muted: #6b7280;
      --accent: #4f46e5; --accent-hover: #4338ca; --log-bg: #0f172a; --log-text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--border); }
    header h1 { margin: 0; font-size: 18px; }
    header a { color: var(--accent); text-decoration: none; font-weight: 500; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 20px; padding: 20px 24px; }
    #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-content: start; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .card h2 { margin: 0; font-size: 15px; }
    .card p { margin: 0; color: var(--muted); }
    .event-name { font: 12px ui-monospace, monospace; color: var(--accent); }
    textarea, input[type=text] { width: 100%; font: 12px ui-monospace, monospace; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
    textarea { resize: vertical; min-height: 54px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 500; cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: #e5e7eb; color: var(--text); }
    .toggle { display: flex; align-items: center; gap: 6px; font-weight: 500; }
    .card .devui { margin-left: auto; font-size: 12px; color: var(--muted); }
    pre.output { margin: 0; background: #f1f5f9; border-radius: 6px; padding: 8px; font-size: 12px; white-space: pre-wrap; }
    #log-panel { position: sticky; top: 20px; height: calc(100vh - 100px); display: flex; flex-direction: column; background: var(--log-bg); border-radius: 10px; overflow: hidden; }
    #log-panel .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: var(--log-text); font-weight: 600; border-bottom: 1px solid #1e293b; }
    #log { flex: 1; overflow-y: auto; padding: 8px 14px; font: 12px/1.6 ui-monospace, monospace; color: var(--log-text); }
    .row { display: flex; gap: 8px; align-items: baseline; }
    .row .time { color: #64748b; flex-shrink: 0; }
    .row .fn { flex-shrink: 0; padding: 0 6px; border-radius: 4px; color: #0f172a; font-weight: 600; }
    #toast { position: fixed; left: 24px; bottom: 24px; max-width: 520px; padding: 10px 14px; border-radius: 8px; background: #111827; color: #fff; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.show { opacity: .95; }
    #toast.error { background: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <h1>Inngest Demo</h1>
    <a id="devui-link" target="_blank">Open Inngest Dev UI ↗</a>
  </header>

  <main>
    <section id="cards"></section>
    <aside id="log-panel">
      <div class="bar">
        <span>Live activity</span>
        <button class="secondary" id="clear-log">Clear</button>
      </div>
      <div id="log"></div>
    </aside>
  </main>

  <div id="toast"></div>

  <script>
    // Same port as this page, so it also works when Caddy runs on a non-default port.
    const DEV_UI = `${location.protocol}//inngest.localhost${location.port ? ":" + location.port : ""}`;

    // Each scenario is one card. Buttons may override the event name, data or count.
    const SCENARIOS = [
      { title: "0. Fan-out", text: "One event, two functions. Each gets its own run, retries and logs.",
        event: "demo/order.created", data: { order_id: "ord_123", total: 99.9 },
        buttons: [{ label: "Send" }] },
      { title: "1. Concurrency", text: "Limit 2. Send 6 jobs and watch at most 2 encode at the same time.",
        event: "demo/video.encode", data: { video_id: "vid_42" },
        buttons: [{ label: "Send 6×", count: 6 }] },
      { title: "2. Partial replay", text: "Steps are memoized. Turn on 'shipping broken', send, watch only ship-order retry, then turn it off.",
        event: "demo/order.process", data: { order_id: "ord_777" },
        buttons: [{ label: "Send" }], toggle: true },
      { title: "3. Debounce", text: "Type below: one event per keystroke, one run 3s after you stop.",
        event: "demo/search.typed", data: { user_id: "user_1" }, typing: true, buttons: [] },
      { title: "4. Idempotency", text: "Same payment_id sent 3 times: only 1 charge.",
        event: "demo/payment.requested", data: { payment_id: "pay_001", amount: 50 },
        buttons: [{ label: "Send same payment 3×", count: 3 }] },
      { title: "5. on_failure", text: "Always fails. After 1 retry (3s later), the on_failure handler sends an alert.",
        event: "demo/risky.task", data: { task_id: "task_9" },
        buttons: [{ label: "Send" }] },
      { title: "6. Output", text: "The function's return value is stored. We read it back from the Inngest API.",
        event: "demo/report.generate", data: { month: "2026-10" },
        buttons: [{ label: "Generate report", showOutput: true }] },
      { title: "7. Rate limit", text: "1 per user per 10s. Send 5: 1 runs, 4 are DROPPED.",
        event: "demo/notification.send", data: { user_id: "user_1" },
        buttons: [{ label: "Send 5×", count: 5 }] },
      { title: "8. Throttle", text: "1 every 5s. Send 5: all run, ~5s apart (a burst of 2 may start together). Nothing dropped.",
        event: "demo/api.sync", data: { resource: "contacts" },
        buttons: [{ label: "Send 5×", count: 5 }] },
      { title: "9. Priority", text: "One at a time. Queue 5 free tickets, then 1 enterprise: it jumps ahead of every waiting free ticket.",
        event: "demo/ticket.created", data: { plan: "free" },
        buttons: [{ label: "5 free, then 1 enterprise",
                    sequence: [{ data: { plan: "free" }, count: 5 }, { data: { plan: "enterprise" }, count: 1 }] }] },
      { title: "10. Singleton", text: "One run per account. Send 3 quickly: 1 runs, 2 are skipped.",
        event: "demo/account.sync", data: { account_id: "acc_1" },
        buttons: [{ label: "Send 3×", count: 3 }] },
      { title: "11. Timeouts", text: "Runs must finish within 10s.",
        event: "demo/slow.task", data: { seconds: 3 },
        buttons: [{ label: "3s (completes)", data: { seconds: 3 } }, { label: "15s (times out)", data: { seconds: 15 } }] },
      { title: "12. Batch", text: "Up to 5 events per run, or whatever arrived after 5s. Send 12: runs of 5, 5, 2.",
        event: "demo/page.viewed", data: { page: "/pricing" },
        buttons: [{ label: "Send 12×", count: 12 }] },
      { title: "13. Cancellation", text: "Schedule a reminder (sleeps 30s), then cancel it with another event.",
        event: "demo/reminder.scheduled", data: { reminder_id: "rem_1" },
        buttons: [{ label: "Schedule" }, { label: "Cancel", event: "demo/reminder.cancelled" }] },
    ];

    // ---------- helpers ----------

    function el(tag, props = {}, children = []) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    let toastTimer;
    function toast(message, isError = false) {
      const t = document.getElementById("toast");
      t.textContent = message;
      t.className = "show" + (isError ? " error" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (t.className = ""), 3000);
    }

    async function api(method, path, body) {
      const resp = await fetch(path, {
        method,
        headers: body ? { "content-type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!resp.ok) {
        const detail = (await resp.json().catch(() => ({}))).detail || resp.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return resp.status === 204 ? null : resp.json();
    }

    async function sendEvent(name, data, count = 1) {
      const { ids } = await api("POST", "/api/events", { name, data, count });
      return ids;
    }

    // ---------- cards ----------

    function renderCard(scenario) {
      const json = JSON.stringify(scenario.data, null, 2);
      const textarea = el("textarea", { value: json, rows: json.split("\n").length });
      const output = el("pre", { className: "output", hidden: true });
      const buttons = el("div", { className: "buttons" });

      const readData = () => JSON.parse(textarea.value || "{}");

      for (const btn of scenario.buttons) {
        const button = el("button", { textContent: btn.label });
        button.onclick = async () => {
          try {
            const steps = btn.sequence || [{ data: btn.data, count: btn.count }];
            let ids = [];
            for (const s of steps) {
              ids = ids.concat(await sendEvent(btn.event || scenario.event, s.data || readData(), s.count || 1));
            }
            toast(`Sent ${ids.length} event(s) → ${btn.event || scenario.event}`);
            if (btn.showOutput) showOutput(ids[0], output);
          } catch (err) {
            toast(err.message, true);
          }
        };
        buttons.append(button);
      }

      if (scenario.toggle) {
        const checkbox = el("input", { type: "checkbox" });
        api("GET", "/api/toggles/shipping-broken").then((t) => (checkbox.checked = t.enabled));
        checkbox.onchange = async () => {
          await api("PUT", "/api/toggles/shipping-broken", { enabled: checkbox.checked });
          toast(`Shipping broken: ${checkbox.checked ? "ON" : "OFF"}`);
        };
        buttons.append(el("label", { className: "toggle" }, [checkbox, "shipping broken"]));
      }

      const extra = [];
      if (scenario.typing) {
        const input = el("input", { type: "text", placeholder: "Type a search query…" });
        input.oninput = () =>
          sendEvent(scenario.event, { ...readData(), query: input.value }).catch((e) => toast(e.message, true));
        extra.push(input);
      }

      buttons.append(el("a", { className: "devui", href: `${DEV_UI}/runs`, target: "_blank", textContent: "Dev UI ↗" }));

      return el("div", { className: "card" }, [
        el("h2", { textContent: scenario.title }),
        el("p", { textContent: scenario.text }),
        el("div", { className: "event-name", textContent: scenario.event }),
        textarea,
        ...extra,
        buttons,
        output,
      ]);
    }

    // Poll the Inngest REST API (through our backend) until the run finishes, then show its output.
    async function showOutput(eventId, pre) {
      pre.hidden = false;
      pre.textContent = "Waiting for the run to finish…";
      for (let i = 0; i < 30; i++) {
        await new Promise((r) => setTimeout(r, 1000));
        const { data } = await api("GET", `/api/events/${eventId}/runs`).catch(() => ({ data: [] }));
        const run = data && data[0];
        if (run && ["Completed", "Failed", "Cancelled"].includes(run.status)) {
          pre.textContent = `status: ${run.status}\noutput: ${JSON.stringify(run.output, null, 2)}`;
          return;
        }
      }
      pre.textContent = "Run did not finish in 30s. Check the Dev UI.";
    }

    // ---------- live log ----------

    let lastId = 0;
    const logBox = document.getElementById("log");

    function colorFor(name) {
      let hash = 0;
      for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) % 360;
      return `hsl(${hash}, 70%, 70%)`;
    }

    function formatTime(ts) {
      const d = new Date(ts * 1000);
      return d.toTimeString().slice(0, 8) + "." + String(d.getMilliseconds()).padStart(3, "0");
    }

    async function pollLogs() {
      try {
        const entries = await api("GET", `/api/logs?after=${lastId}`);
        const stick = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 20;
        for (const e of entries) {
          lastId = e.id;
          const fn = el("span", { className: "fn", textContent: e.function, title: e.run_id || "" });
          fn.style.background = colorFor(e.function);
          logBox.append(el("div", { className: "row" }, [
            el("span", { className: "time", textContent: formatTime(e.ts) }),
            fn,
            el("span", { textContent: e.message }),
          ]));
        }
        if (stick) logBox.scrollTop = logBox.scrollHeight;
      } catch {
        // App restarting (hot reload): try again on the next tick.
      }
    }

    document.getElementById("clear-log").onclick = async () => {
      await api("DELETE", "/api/logs");
      logBox.replaceChildren();
    };

    // ---------- boot ----------

    document.getElementById("devui-link").href = DEV_UI;
    document.getElementById("cards").append(...SCENARIOS.map(renderCard));
    pollLogs();
    setInterval(pollLogs, 1000);
  </script>
</body>
</html>
