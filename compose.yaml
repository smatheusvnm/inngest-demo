name: inngest-demo

services:
  # FastAPI app: UI + API + Inngest functions (hot reload on ./app changes)
  app:
    build: .
    environment:
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
    volumes:
      - ./app:/code/app

  # Inngest dev server: event API, queue, executor and Dev UI (state is in memory)
  inngest:
    image: inngest/inngest:latest
    command: inngest dev --host 0.0.0.0 -u http://app:8000/api/inngest --no-discovery
    ports:
      - "${INNGEST_PORT:-8288}:8288" # fallback Dev UI at http://localhost:8288
    depends_on:
      - app

  # Caddy: local HTTPS for https://app.localhost and https://inngest.localhost
  caddy:
    image: caddy:2-alpine
    # Host ports are overridable (HTTP_PORT / HTTPS_PORT) if 80/443 are busy.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - inngest

volumes:
  caddy_data:
  caddy_config:
