[project]
name = "inngest-demo"
version = "0.1.0"
description = "FastAPI + Inngest demo of the main Inngest features"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "inngest>=0.5.19",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Silence deprecation noise from third-party packages (inngest, starlette).
filterwarnings = ["ignore::DeprecationWarning"]
